[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-tunnel-watch"
version = "0.1.0"
description = "A terminal dashboard and reconnect supervisor for OpenSSH tunnels"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ssh-tunnel-watch contributors"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ssh-tunnel-watch = "ssh_tunnel_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
